<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Personal Assistant</title>
<script>
/* Theme: follow the phone, one dark palette defined once in CSS */
(function () {
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const set = () => document.documentElement.dataset.theme = mq.matches ? "dark" : "light";
  set(); mq.addEventListener("change", set);
})();
</script>
<style>
/* Layout: iOS-style planner. Four tabs (Today, Work, Personal, Calendar) in a floating tab bar on phones and a sidebar on wide screens. Every screen is one level of grouped lists; detail lives in sheets. Today: Last/Now/Next, Meetings, Work, Personal, Routines. Work: Actions by date, Waiting by person, Audits by client, Done. Personal: Tasks by date, Routines by how they repeat. Calendar: Month or the next 7 days. Neutral surfaces in both themes; colour is kept to small icons and the phase chips. */
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --fill: #E9E9EE;
  --fill2: #F2F2F7;
  --label: #111114;
  --label2: #5E5E66;
  --sep: rgba(60, 60, 67, .18);
  --late: #C2312A;
  --done: #1E7A53;
  --accent: #111114;
  --i-work: #3A62D6; --i-personal: #A2477E; --i-meet: #5E6577; --i-event: #0E7FA6; --i-bday: #C26A0A; --i-hol: #2E8A4F;
  --c-tamkeen: #7A4CC2; --c-ashraq: #C9621B; --c-arcapita: #2A6FD0; --c-tayseer: #0B8584; --c-ram: #2E8A4F; --c-dwe: #B23A5B; --c-internal: #6E6A80;
  --k-gym: #C0297A; --k-supp: #6E8B12; --k-faith: #3F4AA8; --k-home: #0E7FA6; --k-laundry: #5F7FA8; --k-shop: #A84F2A; --k-errand: #9A7300; --k-car: #7A6A58; --k-money: #3B7A2A; --k-self: #DB4E95; --k-other: #7C818A;
  --glass: rgba(249, 249, 251, .92);
  --shadow: 0 10px 30px rgba(0, 0, 0, .12);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --r: 12px;
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --fill: #2C2C2E; --fill2: #232325; --label: #F5F5F7; --label2: #A1A1A6; --sep: rgba(84, 84, 88, .55);
  --late: #FF6961; --done: #4CD38A;
  --accent: #F5F5F7;
  --i-work: #8DA4E7; --i-personal: #C994B4; --i-meet: #A2A6B0; --i-event: #73B5CB; --i-bday: #F2B55E; --i-hol: #86CBA0;
  --c-tamkeen: #B297DC; --c-ashraq: #E0A47B; --c-arcapita: #83ABE4; --c-tayseer: #71B8B8; --c-ram: #86CBA0; --c-dwe: #E395AC; --c-internal: #ABA9B5;
  --k-gym: #DA83B2; --k-supp: #ABBC76; --k-faith: #9096CD; --k-home: #73B5CB; --k-laundry: #A2B5CD; --k-shop: #CD9983; --k-errand: #C4AE6B; --k-car: #B2A99E; --k-money: #8DB283; --k-self: #EA98C2; --k-other: #B3B6BB;
  --glass: rgba(28, 28, 30, .94); --shadow: 0 10px 30px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
html { font-size: 17px; background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--label); font-family: var(--font); font-size: 1rem; line-height: 1.35; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
* { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; touch-action: manipulation; }
html.lock { overflow: hidden; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 1.15em; height: 1.15em; flex: none; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { display: grid; grid-template-columns: 1fr; overflow-x: clip; }
.side { display: none; }
.main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 58px); padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); max-width: 1120px; width: 100%; margin: 0 auto; display: grid; gap: 24px; align-content: start; }
.navbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; padding-top: 2px; }
.navbar .acts { display: flex; gap: 6px; flex: none; }
.navbar h1 { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.navbar .sub { color: var(--label2); font-size: .88rem; margin-top: 3px; }
.icon-btn { position: relative; width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--card); color: var(--label); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn[aria-pressed="true"] { background: var(--label); color: var(--card); }
.icon-btn .badge-n { top: -3px; right: -3px; }

.cols { display: grid; gap: 24px; align-items: start; }
.col { display: grid; gap: 24px; min-width: 0; align-content: start; }
.section { display: grid; gap: 8px; min-width: 0; }
.sh { display: flex; align-items: center; gap: 10px; padding: 0 4px; width: 100%; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.chev { width: 16px; height: 16px; flex: none; color: var(--label2); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.folded > .sh .chev, .folded > .ch .chev, .folded > .subh .chev { transform: rotate(-90deg); }
.section > .fb { display: grid; gap: 8px; min-width: 0; }
.folded > .fb { display: none; }
.section.folded { gap: 0; }
.dl .go { width: 14px; height: 14px; color: var(--label3, var(--label2)); opacity: .6; flex: none; }
.dl[data-act] { grid-template-columns: 74px minmax(0, 1fr) auto; cursor: pointer; color: inherit; font: inherit; }
.dl[data-act]:active { background: var(--fill, rgba(127,127,127,.12)); }
.sh .tile { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--card); color: var(--label); flex: none; }
.sh .tile svg { width: 18px; height: 18px; }
.sh h2 { margin: 0; font-size: 1.24rem; font-weight: 700; letter-spacing: -.01em; flex: 1; }
.sh .n { font-size: .88rem; color: var(--label2); font-variant-numeric: tabular-nums; }
.card { background: var(--card); border-radius: var(--r); overflow: hidden; }
.ch { width: 100%; border: 0; background: none; font-family: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 12px 16px 6px; font-size: .82rem; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: .05em; }
.ch .dot { width: 9px; height: 9px; border-radius: 50%; }
.card.folded > .ch { padding-bottom: 12px; }
.ch .chev { margin-left: auto; }
.ch .cnt + .chev { margin-left: 2px; }
.ch .cnt { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.subh { display: flex; align-items: center; justify-content: space-between; width: 100%; border-left: 0; border-right: 0; border-bottom: 0; background: none; font-family: inherit; text-align: left; cursor: pointer; padding: 10px 16px 4px 16px; font-size: .74rem; font-weight: 700; color: var(--label2); text-transform: uppercase; letter-spacing: .04em; border-top: .5px solid var(--sep); }
.ch + .subh, .fb > .sg:first-child > .subh { border-top: 0; padding-top: 2px; }
.sg.folded > .subh { padding-bottom: 10px; }
.dayh { display: flex; align-items: center; gap: 8px; width: 100%; border-left: 0; border-right: 0; border-bottom: 0; background: none; font-family: inherit; text-align: left; cursor: pointer; padding: 10px 16px 4px 100px; font-size: .78rem; font-weight: 600; color: var(--label2); border-top: .5px solid var(--sep); }
.card > .dayh:first-child, .ch + .dayh, .card > .dg:first-child > .dayh, .fb > .dg:first-child > .dayh { border-top: 0; }
.dayh .chev { margin-left: auto; }
.dayh .cnt { margin-left: auto; font-variant-numeric: tabular-nums; }
.dayh .cnt + .chev { margin-left: 2px; }
.dg.folded > .dayh { padding-bottom: 10px; }
.folded > .dayh .chev { transform: rotate(-90deg); }
.empty { padding: 18px 16px; color: var(--label2); font-size: .94rem; }
.foot { font-size: .78rem; color: var(--label2); padding: 0 4px; max-width: 70ch; }

/* rows: check, icon, title */
.sw { position: relative; overflow: hidden; }
.sw + .sw .row::before { content: ""; position: absolute; top: 0; left: 100px; right: 0; border-top: .5px solid var(--sep); }
.sw-under { position: absolute; inset: 0; display: flex; justify-content: space-between; }
.sw-under div { display: flex; }
.sw-under button { border: 0; color: #fff; font-weight: 600; font-size: .82rem; min-width: 76px; display: grid; place-items: center; align-content: center; gap: 2px; }
.u-done { background: #1E7A53; } .u-delay { background: #8F5600; } .u-skip { background: #5E6577; }
.row { position: relative; display: grid; grid-template-columns: 44px 38px minmax(0, 1fr) auto; align-items: center; gap: 0 10px; padding: 6px 12px 6px 6px; min-height: 56px; background: var(--card); touch-action: pan-y; transition: transform .34s cubic-bezier(.32, .72, 0, 1); }
.row.dragging { transition: none; will-change: transform; }
.check { width: 44px; height: 44px; border: 0; background: none; padding: 0; display: grid; place-items: center; }
.check i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--label2); display: grid; place-items: center; opacity: .8; transition: background .2s, border-color .2s; }
.row.routine .check i { border-style: dashed; }
.row.s-done .check i { background: var(--done); border-color: var(--done); border-style: solid; opacity: 1; }
.row.s-done .check i::after { content: ""; width: 10px; height: 5px; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
.row.s-skipped .check i { border-style: solid; opacity: .45; }
.row.s-skipped .check i::after { content: ""; width: 11px; height: 2.5px; background: var(--label2); border-radius: 2px; }
.row.meet .check { visibility: hidden; }
.itile { width: 38px; height: 38px; border-radius: 10px; background: var(--fill2); display: grid; place-items: center; color: var(--ic, var(--label2)); }
.itile svg { width: 20px; height: 20px; }
.ttl { border: 0; background: none; text-align: left; padding: 8px 0; min-width: 0; font-size: 1rem; overflow-wrap: anywhere; cursor: pointer; display: grid; gap: 1px; }
.ttl .tt { display: block; }
.ttl .meta { display: block; font-size: .76rem; line-height: 1.3; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.ttl .meta .late { color: var(--late); font-weight: 600; }
.ttl .meta .sep { opacity: .55; margin: 0 4px; }
/* priority marker beside the title: an up chevron in the accent colour for high, a muted down chevron for low */
.pri { display: inline-block; width: 14px; height: 14px; margin: 0 0 2px 4px; vertical-align: middle; color: var(--accent); }
.pri.low { color: var(--label2); opacity: .7; }
.pri svg { width: 14px; height: 14px; display: block; }
.row.meet .ttl { cursor: pointer; }
.row.meet .meta .chip { font-size: .68rem; padding: 1px 6px; margin-right: 4px; vertical-align: 1px; }
.row.s-ended .check i { border-style: solid; opacity: .45; }
.row.s-ended .check i::after { content: ""; width: 10px; height: 5px; border-left: 2.5px solid var(--label2); border-bottom: 2.5px solid var(--label2); transform: rotate(-45deg) translate(1px, -1px); }
.row.s-done .ttl, .row.s-skipped .ttl, .row.s-ended .ttl { color: var(--label2); }
.row.s-done .tt, .row.s-skipped .tt, .row.s-ended .tt { text-decoration: line-through; text-decoration-thickness: 1px; }
.flag { display: inline-grid; place-items: center; width: 24px; height: 24px; color: var(--label2); }
.flag svg { width: 18px; height: 18px; }
.flag.late { color: var(--late); }

/* timeline: time gutter with a coloured rail, rows without the icon tile, free gaps and a now line */
.tl { display: grid; }
.tl > * { position: relative; }
.tl > * + *::before, .tl-grp > .fb > .tl-it::before { content: ""; position: absolute; top: 0; left: 62px; right: 0; border-top: .5px solid var(--sep); z-index: 1; }
.tl-it { display: grid; grid-template-columns: 62px minmax(0, 1fr); align-items: stretch; }
.tl-g { position: relative; padding: 15px 10px 0 14px; font-size: .84rem; line-height: 1.15; font-variant-numeric: tabular-nums; color: var(--label); }
.tl-g b { display: block; font-weight: 600; }
.tl-g small { display: block; font-size: .68rem; color: var(--label2); margin-top: 1px; }
.tl-it > .tl-g::after { content: ""; position: absolute; right: 2px; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--ic, var(--label2)); }
.tl-it.past > .tl-g { color: var(--label2); }
.tl-it.past > .tl-g::after { opacity: .35; }
.tl .row { grid-template-columns: 44px minmax(0, 1fr) auto; padding-left: 0; }
.tl .row .itile { display: none; }
.tl-it.sub > .tl-g { padding-left: 22px; font-size: .78rem; }
.tl-now { display: grid; grid-template-columns: 62px minmax(0, 1fr); align-items: center; min-height: 24px; }
.tl-now::before { display: none; }
.tl-now .tl-g { padding: 0 0 0 14px; color: var(--late); }
.tl-now .tl-g b { font-weight: 700; }
.tl-now i { position: relative; height: 2px; background: var(--late); margin-right: 14px; }
.tl-now i::before { content: ""; position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--late); }
.tl-now + *::before { display: none; }
.tl-gap { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; align-items: center; width: 100%; border: 0; background: none; color: var(--done); font: inherit; text-align: left; padding: 6px 14px 6px 0; min-height: 44px; cursor: pointer; }
.tl-gap .gp { border: 1.5px dashed color-mix(in srgb, var(--done) 50%, transparent); border-radius: 10px; padding: 6px 10px; font-size: .86rem; font-weight: 600; }
.tl-gap .go { width: 14px; height: 14px; margin-left: 8px; opacity: .7; }
.tl-gap:active .gp { background: color-mix(in srgb, var(--done) 12%, transparent); }
.tl-gh { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; align-items: center; gap: 0 10px; width: 100%; border: 0; background: none; color: inherit; font: inherit; text-align: left; padding: 6px 14px 6px 0; min-height: 56px; cursor: pointer; }
.tl-gh .ttl { cursor: inherit; }
.tl-grp.folded .tl-gh .chev { transform: rotate(-90deg); }
.ring { width: 24px; height: 24px; border-radius: 50%; justify-self: center; position: relative; background: conic-gradient(var(--done) var(--p), var(--fill) 0); }
.ring::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--card); }
.ring.full::after { inset: 0; background: var(--done); }
.ring.full::before { content: ""; position: absolute; z-index: 1; left: 7px; top: 7px; width: 10px; height: 5px; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: rotate(-45deg); }
.tl-it.prop .prop-b { display: flex; align-items: center; gap: 6px; margin: 6px 14px 6px 0; padding: 4px 4px 4px 12px; border: 1.5px dashed var(--label2); border-radius: 12px; min-width: 0; }
.prop-b .ttl { flex: 1; padding: 4px 0; cursor: default; }
.ib.ok { color: var(--done); }
.propbar { display: flex; align-items: center; gap: 8px; padding: 4px 14px 10px 16px; font-weight: 600; font-size: .9rem; }
.propbar span { flex: 1; }
.card-acts { display: flex; gap: 8px; padding: 8px 16px 14px; flex-wrap: wrap; border-top: .5px solid var(--sep); }
.ch + .card-acts, .fb > .card-acts:first-child { border-top: 0; }
/* today's load */
.cap { background: var(--card); border-radius: var(--r); padding: 12px 16px; display: grid; gap: 8px; }
.cap-h { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; font-size: .84rem; color: var(--label2); font-variant-numeric: tabular-nums; }
.cap-h b { color: var(--label); font-size: .95rem; font-weight: 600; }
.cap-bar { height: 8px; border-radius: 4px; background: var(--fill); overflow: hidden; }
.cap-bar i { display: block; height: 100%; border-radius: 4px; background: var(--done); transition: width .4s cubic-bezier(.2, .8, .2, 1); }
.cap-bar.warn i { background: #C98A12; }
.cap-bar.over i { background: var(--late); }
.cap-n { font-size: .78rem; color: var(--label2); }
.cap-n.late { color: var(--late); font-weight: 600; }
/* morning plan */
.planb { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 0 14px; width: 100%; border: 0; border-radius: 18px; padding: 14px 16px; background: var(--card); color: inherit; font: inherit; text-align: left; cursor: pointer; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--done) 55%, transparent); }
.planb .big { width: 52px; height: 52px; border-radius: 14px; background: var(--fill2); display: grid; place-items: center; color: var(--done); }
.planb .big svg { width: 26px; height: 26px; }
.planb .ey { font-size: .82rem; font-weight: 600; color: var(--label2); }
.planb b { font-weight: 700; font-size: 1.1rem; }
.planb small { display: block; color: var(--label2); font-size: .8rem; margin-top: 2px; }
.planb .go { width: 14px; height: 14px; color: var(--label2); }
.planb:active { transform: scale(.98); }
.pl-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 52px; }
.pl-row + .pl-row { border-top: .5px solid var(--sep); }
.pl-row .ttl { flex: 1; padding: 0; cursor: default; }
.pl-row.ov { flex-wrap: wrap; }
.pl-row.ov .pl-acts { width: 100%; }
.pl-acts { display: flex; gap: 6px; flex-wrap: wrap; }
.pl-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--done); flex: none; margin: 0; }
.steps { margin: 0; padding: 12px 16px 12px 34px; display: grid; gap: 8px; font-size: .92rem; line-height: 1.4; }
.steps code { background: var(--fill); padding: 1px 5px; border-radius: 6px; font-size: .85em; }
/* rest timer */
.rest { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); z-index: 60; display: flex; align-items: center; gap: 8px; background: var(--label); color: var(--card); border-radius: 28px; padding: 6px 6px 6px 18px; box-shadow: var(--shadow); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rest .rl { font-size: .8rem; font-weight: 600; opacity: .75; }
.rest b { font-size: 1.25rem; font-family: var(--font-round); min-width: 3.4ch; }
.rest button { border: 0; border-radius: 18px; min-height: 40px; min-width: 44px; padding: 0 12px; background: color-mix(in srgb, var(--card) 22%, transparent); color: var(--card); font-weight: 700; }
.set .sn { border: 0; padding: 0; cursor: pointer; }
.set .sn.on { background: var(--done); color: #fff; }
.set .sn svg { width: 13px; height: 13px; }
.ex-last { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chip.pr { background: color-mix(in srgb, var(--done) 18%, transparent); color: var(--done); }
.ex-t .chip { white-space: nowrap; line-height: 1.4; align-self: center; }
.cell.pk { gap: 12px; min-height: 56px; }
.cell.pk > span { flex: 1; padding: 10px 0; line-height: 1.3; }
.cell.pk .go { width: 14px; height: 14px; color: var(--label2); flex: none; }
.cell.pk:disabled { opacity: .5; }
/* calendar load */
.loads { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; margin: -8px 0 -6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.loads::-webkit-scrollbar { display: none; }
.ld { flex: 1 0 74px; border: 0; border-radius: 12px; background: var(--card); padding: 8px 10px; display: grid; gap: 2px; text-align: left; font-size: .76rem; color: var(--label2); font-variant-numeric: tabular-nums; }
.ld b { color: var(--done); font-size: .92rem; font-weight: 600; }
.ld.heavy b { color: #C98A12; }
.ld.over b { color: var(--late); }
.ld.off b { color: var(--label2); }
.cd { position: relative; }
.cd .cn { position: absolute; top: 3px; right: 5px; font-size: .62rem; font-weight: 600; color: var(--label2); }

/* up next: Last, Now and Up Next in one card */
.next.trio { display: block; padding: 0; overflow: hidden; }
.tr-row { width: 100%; border: 0; background: none; color: inherit; font: inherit; text-align: left; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto auto; align-items: center; gap: 0 12px; padding: 10px 16px; min-height: 60px; cursor: pointer; }

.next { background: var(--card); border-radius: 18px; padding: 16px; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 14px; align-items: center; }
.next .big { grid-row: span 2; width: 52px; height: 52px; border-radius: 14px; background: var(--fill2); display: grid; place-items: center; color: var(--ic, var(--label)); }
.next .big svg { width: 26px; height: 26px; }
.next .ey { font-size: .82rem; font-weight: 600; color: var(--label2); }
.next .ey b { font-family: var(--font-round); color: var(--label); font-variant-numeric: tabular-nums; }
.next h2 { margin: 0; font-size: 1.24rem; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.next .acts { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

.btn { min-height: 44px; border-radius: 12px; border: 0; padding: 0 18px; font-weight: 600; background: var(--fill); color: var(--label); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

.btn, .icon-btn, .tabbar button, .side button, .seg button, .txtbtn, .ib, .rm, .unit { transition: transform .16s cubic-bezier(.2, .8, .2, 1), opacity .16s; }
.btn:active, .icon-btn:active, .tabbar button:active, .ib:active, .rm:active, .unit:active { transform: scale(.96); opacity: .85; }

@keyframes v-in { from { opacity: 0; transform: translate3d(0, 8px, 0); } to { opacity: 1; transform: none; } }
.main.enter { animation: v-in .26s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 10px; padding: 2px; }
.seg button { border: 0; background: none; border-radius: 8px; font-size: .88rem; font-weight: 600; min-height: 32px; padding: 0 10px; }

.seg label input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.seg label span { display: grid; place-items: center; border-radius: 8px; font-size: .88rem; font-weight: 600; min-height: 32px; padding: 0 10px; cursor: pointer; }
.seg label input:checked + span { background: var(--card); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
.seg label input:focus-visible + span { outline: 3px solid var(--accent); }
.cell .seg { flex: 1; max-width: 62%; }
/* client filter chips */
.cfrow { display: flex; gap: 8px; overflow-x: auto; padding: 2px 4px 6px; margin: -8px 0 -6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; touch-action: pan-x; -webkit-mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 20px), transparent); mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 20px), transparent); }
.cfrow::-webkit-scrollbar { display: none; }
.cfc { flex: none; border: 0; border-radius: 16px; min-height: 32px; padding: 0 12px; background: var(--card); color: var(--label2); font-size: .82rem; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.cfc .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ic, var(--label2)); }
.cfc[aria-pressed="true"] { background: var(--ic, var(--label)); color: var(--bg); }
.cfc.all[aria-pressed="true"] { background: var(--label); color: var(--card); }
.cfc[aria-pressed="true"] .dot { background: var(--bg); opacity: .85; }
/* failed saves: a slim banner at the top of the current tab */
.failed { position: fixed; top: calc(60px + env(safe-area-inset-top, 0px)); left: 50%; transform: translate3d(-50%, 0, 0); z-index: 46; background: var(--card); color: var(--label); font-size: .82rem; font-weight: 600; padding: 6px 6px 6px 14px; border-radius: 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px); white-space: nowrap; }

/* second badge on the Today tab: items to chase */
.badge-n.chase { right: auto; left: -11px; background: var(--label2); }
/* touches on a task */
.hist .kind { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--label2); background: var(--fill); border-radius: 8px; padding: 2px 7px; margin-left: 6px; vertical-align: 1px; }
.cell .v.late { color: var(--late); }
.cell .v .src { margin-left: 6px; }
/* history and details labels */
.src { display: inline-block; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--label2); background: var(--fill); border-radius: 8px; padding: 2px 7px; }
.hist { display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 16px; align-items: start; font-size: .94rem; }
.hist + .hist { border-top: .5px solid var(--sep); }
.hist time { color: var(--label2); font-size: .82rem; font-weight: 600; font-variant-numeric: tabular-nums; padding-top: 2px; }
.hist b { font-weight: 600; }
.hist small { grid-column: 2 / -1; color: var(--label2); font-size: .82rem; overflow-wrap: anywhere; }
.hist .rm { grid-row: span 2; align-self: center; width: 32px; height: 32px; }
.search { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 10px; padding: 0 10px; min-height: 38px; color: var(--label2); }

.tools { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

/* tab bar */
/* tab bar: docked to the bottom edge and filling the home indicator area, so nothing ever shows beneath it */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 6px max(12px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 4px) max(12px, env(safe-area-inset-right, 0px)); background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8); border-top: .5px solid var(--sep); transform: translate3d(0, 0, 0); }
.tabbar button { border: 0; background: none; border-radius: 14px; min-height: 50px; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: .64rem; font-weight: 600; color: var(--label2); padding: 0; }
.tabbar button svg { width: 25px; height: 25px; }
.tabbar button[aria-current="page"] { color: var(--accent); }
.tabbar button { transition: transform .16s cubic-bezier(.2, .8, .2, 1), color .2s; }
.tabbar button:active { transform: scale(.94); }
.tabbar .b { position: relative; display: grid; }
.badge-n { position: absolute; top: -5px; right: -11px; background: var(--late); color: #fff; font-size: .68rem; min-width: 19px; height: 19px; border-radius: 10px; display: grid; place-items: center; padding: 0 4px; font-weight: 700; }
@media (prefers-reduced-transparency: reduce) { .tabbar, .topbar { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; } }
/* top bar: the Work or Personal switch, fixed under the status bar. Flush with the page at the top, glass once the page scrolls under it. */
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px; display: grid; justify-items: center; background: var(--bg); transform: translate3d(0, 0, 0); transition: background-color .2s, box-shadow .2s; }
.topbar.on { background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8); box-shadow: 0 .5px 0 var(--sep); }
.topbar .mode { width: min(320px, 100%); margin: 0; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); z-index: 40; opacity: 0; transition: opacity .4s cubic-bezier(.32, .72, 0, 1); touch-action: none; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--bg); border-radius: 16px 16px 0 0; max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column; transform: translate3d(0, 100%, 0); transition: transform .42s cubic-bezier(.32, .72, 0, 1); will-change: transform; box-shadow: var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px); }

.sh-bar { touch-action: none; }
.grab::before { content: ""; width: 38px; height: 5px; border-radius: 3px; background: var(--label2); opacity: .45; }
.sh-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px 6px; gap: 8px; flex: none; }
.sh-bar h2 { margin: 0; font-size: 1rem; font-weight: 600; text-align: center; }
.sh-bar .l { justify-self: start; } .sh-bar .r { justify-self: end; }
.txtbtn { border: 0; background: none; color: var(--accent); font-size: 1rem; min-height: 44px; padding: 0 10px; }
.txtbtn.strong { font-weight: 600; }
.sh-body { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; min-height: 0; flex: 1 1 auto; grid-auto-rows: max-content; align-content: start; padding: 4px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.hero { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 2px 14px; align-items: center; }
.hero .big { grid-row: span 2; width: 52px; height: 52px; border-radius: 14px; background: var(--card); display: grid; place-items: center; color: var(--ic, var(--label)); }
.hero .big svg { width: 26px; height: 26px; }
.hero h3 { margin: 0; font-size: 1.3rem; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }

.banner { border-radius: 10px; padding: 10px 12px; font-size: .88rem; background: var(--card); display: flex; gap: 8px; align-items: center; }
.banner svg { width: 18px; height: 18px; color: var(--late); }
.lbl { font-size: .76rem; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: .05em; padding: 0 4px; margin-bottom: -10px; }
.list { background: var(--card); border-radius: var(--r); overflow: hidden; }
.cell { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 16px; min-height: 48px; }
.cell + .cell { border-top: .5px solid var(--sep); }
.cell .v { color: var(--label2); text-align: right; overflow-wrap: anywhere; }
.cell input, .cell select { border: 0; background: none; text-align: right; font-size: 1rem; color: var(--label2); min-width: 0; max-width: 62%; min-height: 44px; }
.cell input[type="text"] { text-align: left; color: var(--label); max-width: none; flex: 1; }

.cell textarea { border: 0; background: none; min-height: 110px; resize: vertical; font-size: 1rem; width: 100%; padding: 0; }
.notes { white-space: pre-wrap; padding: 12px 16px; font-size: .94rem; line-height: 1.5; }
.daypick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px 12px; border-top: .5px solid var(--sep); }
.daypick label { display: grid; }

.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 16px; background: var(--fill); transition: background .2s; pointer-events: none; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); animation: t-in .3s cubic-bezier(.32, .72, 0, 1); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--label); color: var(--card); padding: 10px 16px; border-radius: 14px; font-size: .88rem; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }
@keyframes t-in { from { opacity: 0; transform: translate3d(-50%, 12px, 0); } to { opacity: 1; transform: translate3d(-50%, 0, 0); } }

/* item lists */
.lbl-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: -10px; }

.cell.li { justify-content: flex-start; gap: 6px; }
.li-n { flex: 1; min-width: 0; overflow-wrap: anywhere; padding: 10px 0; }

.set { display: grid; grid-template-columns: 26px 64px auto 80px auto; align-items: center; gap: 8px; padding-left: 32px; }
.set .sn { width: 22px; height: 22px; border-radius: 11px; background: var(--fill2); display: grid; place-items: center; font-size: .72rem; font-weight: 700; color: var(--label2); }
.set input { border: 0; background: var(--fill2); border-radius: 8px; min-height: 38px; padding: 0 10px; text-align: center; font-variant-numeric: tabular-nums; width: 100%; color: var(--label); }

@media (min-width: 900px) {
  .app { grid-template-columns: 236px 1fr; }
  .side { display: grid; align-content: start; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 28px 12px; border-right: .5px solid var(--sep); }
  .side .brand { font-weight: 700; font-size: 1.05rem; padding: 0 12px 14px; }

    document.querySelectorAll('[data-act="refresh"]').forEach(b => { b.classList.remove("spin"); b.removeAttribute("aria-busy"); if (S.syncedAt) b.title = "Updated " + fT(hhmm(Math.floor((S.syncedAt + 3 * 3600000) / 60000) % 1440)); });
    rfLive.textContent = ok ? "Up to date" : "";
    if (view.style.transform) settle(0);
  }
}
/* Pull down from the top of any tab. Only a mostly vertical drag that starts at the very top counts, so scrolling, row swipes and tab swipes behave as before. */
let pr = null, prFrame = 0;
addEventListener("touchstart", e => {
  pr = null;
  if (refreshing || S.sheet || !S.ready || e.touches.length !== 1 || window.scrollY > 0) return;
  if (e.target.closest(".sheet, .tabbar, input, textarea, select")) return;
  pr = { x: e.touches[0].clientX, y: e.touches[0].clientY, d: 0, on: false };
}, { passive: true });
addEventListener("touchmove", e => {
  if (!pr) return;
  const t = e.touches[0], dy = t.clientY - pr.y, dx = t.clientX - pr.x;
  if (!pr.on) {
    if (dy < 10) { if (dy < -4 || Math.abs(dx) > 10) pr = null; return; }
    if (Math.abs(dx) > dy * .6 || window.scrollY > 0 || (drag && drag.active)) { pr = null; return; }
    pr.on = true; view.classList.remove("enter", "enter-l", "enter-r"); view.classList.add("pulling"); S.swipe = null;
  }
  const raw = dy - 10; pr.d = raw < PULL ? raw * .6 : PULL * .6 + (raw - PULL) * .3; // resists more the further it goes
  pr.d = Math.min(pr.d * 1.35, 150);
  if (!prFrame) prFrame = requestAnimationFrame(() => { prFrame = 0; if (pr) setPull(pr.d); });
}, { passive: true });
const prEnd = () => {
  if (!pr) return; const p = pr; pr = null; cancelAnimationFrame(prFrame); prFrame = 0;
  if (!p.on) return;
  tsw = null;
  if (p.d >= PULL) { settle(HOLD); refreshNow(); } else settle(0);
};
addEventListener("touchend", prEnd, { passive: true }); addEventListener("touchcancel", prEnd, { passive: true });
document.addEventListener("keydown", e => { if (!S.sheet && (e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === "r" || e.key === "R")) { e.preventDefault(); refreshNow(); } });

/* ---------- boot ---------- */
/* Folded groups sync across devices through one Log row ("ui_fold") that the server already stores and returns. */
const FOLD_ID = "ui_fold", FOLD_ROW = { id: FOLD_ID, routineId: "_ui", date: "9999-12-31", status: "", to: "" };
let foldT = 0, foldBusy = false, foldSeq = 0;
function saveFold() {
  const t0 = today(); Object.keys(S.fold).forEach(k => { const m = k.match(/\|d:(\d{4}-\d{2}-\d{2})$/); if (m && m[1] < t0) delete S.fold[k]; }); // past days drop off
  S.logs[FOLD_ID] = { ...FOLD_ROW, checks: { ...S.fold } }; persist();
  foldBusy = true; clearTimeout(foldT); const n = ++foldSeq;
  foldT = setTimeout(() => { api("setChecks", { ...FOLD_ROW, checks: { ...S.fold } }).catch(fail).finally(() => { if (n === foldSeq) foldBusy = false; }); }, 500);
}
/* Engagement rows from the Engagements tab; rows from the older Audits tab are mapped onto the same shape. */
function normEng(a) {
  const ph = a.phase || "";
  return { id: a.id, client: a.client || "", engagement: a.engagement || a.audit || "", template: a.template || "Internal Audit", stage: a.stage || (/Planning|Fieldwork/.test(ph) ? ph : ph === "Reporting" ? "Draft Report" : ""), status: a.status || (ph === "Closed" ? "Closed" : ph === "On hold" ? "On hold" : ph === "Not started" ? "Not started" : "Active"), target: a.target || "", owner: a.owner || a.lead || "Me", next_action: a.next_action || "", next_date: a.next_date || "", last_action: a.last_action || "", last_date: a.last_date || "", notes: a.notes || "", active: a.active !== false && a.active !== "FALSE", updated: a.updated || "" };
}
function applyData(d) {
  S.tasks = d.tasks; S.routines = d.routines; S.touches = Array.isArray(d.touches) ? d.touches : [];
  S.engOk = Array.isArray(d.engagements);
  S.audits = (S.engOk ? d.engagements : Array.isArray(d.audits) ? d.audits : []).map(normEng).filter(a => a.client && a.client !== "DWE");
  if (d.stageMap && typeof d.stageMap === "object") S.stages = d.stageMap;
  else if (Array.isArray(d.stages) && d.stages.length) { const m = {}; d.stages.forEach(r => { if (r.template) m[r.template] = [1, 2, 3, 4, 5, 6].map(i => r["stage" + i]).filter(Boolean); }); S.stages = m; }
  if (Array.isArray(d.contacts)) S.contacts = d.contacts;
  const props = Array.isArray(d.proposals) ? d.proposals.filter(p => p && p.id && String(p.status || "proposed").toLowerCase() === "proposed") : [];
  S.proposals = props.filter(p => String(p.kind || "").toLowerCase() !== "capture");
  S.captures = props.filter(p => String(p.kind || "").toLowerCase() === "capture");
  Object.keys(SNAP).forEach(k => delete SNAP[k]); S.tasks.forEach(snapTask);
  const L = {}; d.log.forEach(l => { L[l.id] = l; }); S.logs = L;
  if (!foldBusy) { const f = L[FOLD_ID]; if (f && f.checks && typeof f.checks === "object") { S.fold = { ...f.checks }; persist(); } else if (Object.keys(S.fold).length) saveFold(); }
  S.ready = true;
}
/* Siri captures: each line becomes a task (the same task id on both iPhones, so it is never doubled), then leaves the queue. */
const capSeen = new Set();
function ingestCaptures() {
  (S.captures || []).forEach(c => {
    if (capSeen.has(c.id)) return; capSeen.add(c.id);
    const id = "t" + c.id;
    if (!S.tasks.some(t => t.id === id)) {
      const q = parseQuick(String(c.title || ""), autoMode());
      if (q.title) { const t = { ...newTask(), ...q, id, source: "siri", status: q.owner !== "Me" ? "waiting" : "due", created: c.at || new Date().toISOString() }; delete t._new; saveTask(t); toast("Added from Siri: " + t.title); }
    }
    api("applyProposals", [c.id], "dismiss").catch(() => {});
  });
  S.captures = [];
}
/* The last copy is kept on the phone so the planner opens instantly; the server copy replaces it a moment later. */
const CACHE = "pa-cache";
let cacheT = 0;
function saveCache() { clearTimeout(cacheT); cacheT = setTimeout(() => { try { localStorage.setItem(CACHE, JSON.stringify({ tasks: S.tasks, routines: S.routines, log: Object.values(S.logs), touches: S.touches, engagements: S.engOk ? S.audits : undefined, audits: S.audits, stageMap: S.stages, contacts: S.contacts, proposals: S.proposals, meetings: S.meetings })); } catch (e) {} }, 400); }
function readCache() { try { const c = JSON.parse(localStorage.getItem(CACHE) || "null"); if (!c || !Array.isArray(c.tasks)) return false; applyData(c); S.meetings = c.meetings || {}; return true; } catch (e) { return false; } }
async function loadAll(first) {
  try {
    if (first) {
      const r = await api("getAll");
      applyData(r.data); applyMeetings(r.meetings, r.from, r.to);
    } else {
      const w0 = writes, d = await api("getData");
      if (pending || writes !== w0 || outbox.length || drag || typing()) return false; // a save is on its way, landed while this copy was read, or you are typing; the next check picks it up
      applyData(d);
    }
    autoFinish();
    ingestCaptures();
    S.syncedAt = Date.now();
    saveCache();
    if (S.sheet) { renderNav(); if (["item", "inbox", "audit", "plan", "resched", "gap", "settings"].includes(S.sheet.type)) renderSheet(); } else render(true);
    checkHash();
    return true;
  } catch (e) {
    if (first && S.ready) { toast("Offline: showing your last saved copy."); return; }
    if (first && KEY) view.innerHTML = lastHtml = `<div class="card"><div class="empty">${esc((e && e.message) || "Your planner couldn't load. Reload to try again.")}</div></div>`;
  }
}
/* A link ending in #plan (from the 8 AM calendar alert or a shortcut) opens Plan Your Day. */
function checkHash() {
  if (!S.ready || S.sheet) return;
  const h = location.hash, t = h.match(/(?:^#|&)task=([^&]+)/), pl = /(^#|&)plan\b/.test(h);
  if (!t && !pl) return;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  if (t) { const id = decodeURIComponent(t[1]); if (S.tasks.some(x => x.id === id)) { if (S.view !== "today") go("today"); openSheet({ type: "item", key: "task:" + encodeURIComponent(id) }); } return; }
  openSheet({ type: "plan" });
}
addEventListener("hashchange", checkHash);
setMode(readMode());
renderNav();
if (!KEY) showSetup(); else { if (readCache()) render(); showOffline(); if (outbox.length) flush(); else loadAll(true); }
setInterval(() => { if (!S.ready) return; if (!busy()) tickMode(); if (busy()) { renderNav(); return; } render(true); }, 60000);
/* Near-live sync between devices: every few seconds ask the server for its change stamp (a tiny call)
   and reload only when another device has saved something. A full reload still runs every 5 minutes as a safety net. */
const typing = () => { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };
let stamp = null, polling = false, polledAt = 0;
async function poll(force) {
  if (polling || document.visibilityState !== "visible" || !S.ready || pending || outbox.length) return;
  polling = true; polledAt = Date.now();
  try {
    const st = String(await call("getStamp"));
    if (force || st !== stamp) { if (await loadAll(false)) stamp = st; } // the first check also reloads, so nothing saved meanwhile is missed
  } catch (e) {} finally { polling = false; }
}
/* The check runs every 6 seconds while the planner is in use, slows to 20 seconds after 10 minutes without a touch and stops after 30 minutes.
   Any touch, click, key, scroll or return to the tab brings it back to 6 seconds and checks straight away. */
const IDLE_SLOW = 600000, IDLE_STOP = 1800000;
let activeAt = Date.now(), pollT = 0;
const pollDelay = () => { const idle = Date.now() - activeAt; return idle >= IDLE_STOP ? 0 : idle >= IDLE_SLOW ? 20000 : 6000; };
function schedulePoll() { clearTimeout(pollT); const d = pollDelay(); if (!d) return; pollT = setTimeout(() => { poll(false); schedulePoll(); }, d); }
function wake() {
  const was = pollDelay(); activeAt = Date.now();
  if (was !== 6000 || Date.now() - polledAt >= 6000) poll(false); // straight away when the cadence had slowed or a check is due
  if (was !== 6000 || !pollT) schedulePoll();
}
["touchstart", "click", "keydown", "scroll"].forEach(ev => addEventListener(ev, wake, { passive: true }));
schedulePoll();
setInterval(() => { if (Date.now() - activeAt < IDLE_SLOW) poll(true); }, 300000); // the full reload safety net runs only while the planner is in use
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !S.ready) return;
  activeAt = Date.now(); schedulePoll();
  poll(true);
  if (outbox.length) flush();
  if (Date.now() - S.loadedAt > 600000) loadMeetings();
  checkVersion();
});
</script>
